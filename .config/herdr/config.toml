# herdr configuration. Every option with its default: `herdr --default-config`.
# Validate with `herdr config check`; apply to a running session with
# `herdr server reload-config`.
#
# ~/.config/herdr/config.toml is a symlink to this file in the ~/.zsh clone, so a change
# goes live with `git -C ~/.zsh pull` and a reload. zResetLocalConfig (alias/functions.sh)
# makes the link on a new machine.
# herdr writes through the link rather than replacing it (`herdr config reset-keys`,
# tested 2026-10-29). README.md's herdr section is the overview of these keys and scripts;
# the reasons for each setting are here.
onboarding = false

[keys]
# Not the default ctrl+b: Claude Code uses ctrl+b to send a running task to the
# background. macOS's own ctrl+space (switch input source) is turned off on this Mac.
prefix = "ctrl+space"

# Direct chords as well as the prefix ones, from herdr's keyboard guide. iTerm2 and
# macOS leave ctrl+alt free.
focus_pane_left = ["prefix+h", "ctrl+alt+h"]
focus_pane_down = ["prefix+j", "ctrl+alt+j"]
focus_pane_up = ["prefix+k", "ctrl+alt+k"]
focus_pane_right = ["prefix+l", "ctrl+alt+l"]
split_vertical = ["prefix+v", "ctrl+alt+d"]
zoom = ["prefix+z", "ctrl+alt+z"]

# All unbound by default. prefix then up/down (navigate mode) also moves between
# workspaces, and prefix+o jumps to whichever agent last raised a notification.
# ⌘⌥↑/↓ can't be bound here: iTerm keeps ⌘ chords for itself. An iTerm key binding that
# sends the escape sequence [1;7A / [1;7B, which is what ctrl+alt+up/down send, makes them
# work too (Settings → Keys → Key Bindings). Not set up yet as of 2026-10-29.
previous_workspace = "ctrl+alt+up"
next_workspace = "ctrl+alt+down"
switch_workspace = "ctrl+alt+1..9"
previous_agent = "ctrl+alt+p"
next_agent = "ctrl+alt+n"

# Code for the focused pane: its own repo, or the repo its Claude session last worked in when
# it started outside one (~/Development). Scripts in ~/.zsh/bin; bin/agent-where picks the repo.
[[keys.command]]
key = "ctrl+alt+e"
type = "shell"
command = "$HOME/.zsh/bin/herdr-code"
description = "project in VS Code"

[[keys.command]]
key = "ctrl+alt+o"
type = "shell"
command = "$HOME/.zsh/bin/herdr-code --edited"
description = "file Claude last edited, in VS Code"

[[keys.command]]
key = "ctrl+alt+f"
type = "popup"
command = "$HOME/.zsh/bin/herdr-find-file"
description = "find a file in the project"
width = "90%"
height = "85%"

[[keys.command]]
key = "ctrl+alt+v"
type = "pane"
command = "$HOME/.zsh/bin/herdr-nvim"
description = "project in Neovim"

# A key rather than a click on the Claude status line's PR link: herdr 0.9.5 drops OSC 8
# hyperlinks from what it draws, so no link can be clicked inside herdr. Tested 2026-10-29 by
# recording a throwaway session's output: the text came through, the link didn't. Setting
# FORCE_HYPERLINK for Claude would not help for the same reason.
[[keys.command]]
key = "ctrl+alt+g"
type = "shell"
command = "$HOME/.zsh/bin/herdr-pr"
description = "pull request in the browser"

[ui]
# Leave the iTerm tab title alone, so the "Development" / "Personal" that hw / hp set
# stays. This file is shared by both sessions and the title has no session token, so
# herdr can't write it itself. Until 2026-10-29 it was "{terminal_title}", Claude's
# task title; the default is "{hostname}: {workspace}".
window_title = ""

# agent_panel_sort stays "spaces". "priority" (blocked agents first) was tried on
# 2026-10-29, but then the agent list no longer matched the workspace order that
# previous/next_workspace step through.

# Don't ask for a workspace name. The first Claude session in the workspace names it:
# the clw name at the first prompt, or Claude's own title after its first reply
# (~/.claude/hooks/herdr-workspace-title.sh). Until then it shows its folder's name.
prompt_new_workspace_name = false

# Each Claude row in the sidebar: its workspace, then its terminal title. Claude puts the
# session's --name there (from clw); herdr strips the spinner glyph in front. The
# default last line, the agent's name, is dropped because it only ever says "claude".
[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "machine", "workspace", "tab"], ["terminal_title_stripped"]]

[ui.toast]
# A macOS notification when an agent in another workspace is blocked or done. This is
# also how the work and personal sessions reach you while you're in the other one.
delivery = "system"

# [experimental] pane_history stays off (the default). It would write recent pane
# output, tokens included, to session-history.json on this Mac.

# clgpt (alias/claude.sh) runs the same claude binary with an extra --settings layer
# that leaves the hooks in ~/.claude/settings.json alone, so herdr should treat a GPT
# session as Claude: state, notifications, the sidebar rows above and the workspace
# name. Worked out from the setup on 2026-10-29, not yet tried live. Known gaps, none
# fixed:
# - A GPT row in the sidebar looks the same as a Claude one; only the session's own status
#   line (claude/statusline.sh) shows the model. Name the session, model first, because
#   clgpt reads its first argument as the model: `clgpt claude-code-gpt-6-sol --name x`.
# - clwt always starts Claude; it has no GPT option.
# - After a herdr server restart a GPT session comes back on Claude. herdr keeps only
#   the session id (session.json) and reopens the pane with its own `claude --resume`,
#   which has none of clgpt's settings. A fix would need clgpt as a script on PATH,
#   reported to herdr as the resume command with
#   `herdr pane report-agent-session <pane> ... -- <command>`.
