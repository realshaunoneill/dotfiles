# herdr configuration. Every option with its default: `herdr --default-config`.
# Validate with `herdr config check`; apply to a running session with
# `herdr server reload-config`.
onboarding = false

[keys]
# Not the default ctrl+b: Claude Code uses ctrl+b to send a running task to the
# background. macOS's own ctrl+space (switch input source) is turned off on this Mac.
prefix = "ctrl+space"

# Direct chords as well as the prefix ones, from herdr's keyboard guide. iTerm2 and
# macOS leave ctrl+alt free.
focus_pane_left = ["prefix+h", "ctrl+alt+h"]
focus_pane_down = ["prefix+j", "ctrl+alt+j"]
focus_pane_up = ["prefix+k", "ctrl+alt+k"]
focus_pane_right = ["prefix+l", "ctrl+alt+l"]
split_vertical = ["prefix+v", "ctrl+alt+d"]
zoom = ["prefix+z", "ctrl+alt+z"]

[ui]
# The iTerm tab/window title: the focused pane's own title, so Claude's task title shows
# through (spinner stripped). The default was "{hostname}: {workspace}".
window_title = "{terminal_title}"

# Don't ask for a workspace name. The first Claude session in the workspace names it:
# the clw name at the first prompt, or Claude's own title after its first reply
# (~/.claude/hooks/herdr-workspace-title.sh). Until then it shows its folder's name.
prompt_new_workspace_name = false

# Give each Claude row in the sidebar a second line with its terminal title. Claude
# puts the session's --name there (from clw); herdr strips the spinner glyph in front.
[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "machine", "workspace", "tab"], ["terminal_title_stripped"], ["agent"]]

[ui.toast]
# A macOS notification when an agent in another workspace is blocked or done. This is
# also how the work and personal sessions reach you while you're in the other one.
delivery = "system"

# [experimental] pane_history stays off (the default). It would write recent pane
# output, tokens included, to session-history.json on this Mac.
