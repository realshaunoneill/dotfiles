# Installed to ~/.config/1Password/ssh/agent.toml by `zSetupSsh` (macOS only).
#
# This file restricts WHICH keys the 1Password SSH agent offers, and in what order.
#
# Its ABSENCE is not neutral: with no agent.toml, 1Password offers every SSH Key
# item from every unlocked account. Two accounts are signed in here
# (a personal one and a work one), so absent means any work SSH
# key is offered to every host you ssh to, in an order you do not control — which
# can burn ssh's MaxAuthTries before your real key is ever tried.
#
# The work key deliberately stays on disk at ~/.ssh/id_rsa and is NOT in
# 1Password, so it does not belong here.
#
# GOTCHAS:
#   - `item` must match the 1Password item TITLE exactly. Renaming the item
#     silently empties the agent.
#   - **The title must contain NO PARENTHESES.** `op://` secret references reject
#     `(` and `)`, so a title like "SSH - personal (ed25519)" cannot be read with
#     `op read` at all - which breaks the pubkey fetch in zSetupSsh.
#   - **Get the title right at creation.** `op item edit` refuses SSH Key items
#     entirely ("SSH Key item editing in the CLI is not yet supported"), so the
#     only way to rename one is to delete and recreate it.
#   - The personal vault is called "Private", not "Personal".
#   - A typo yields an EMPTY agent rather than an error, and 1Password reloads this
#     file automatically — so the failure arrives later and looks like a key
#     problem. The acceptance test is to run this immediately after saving and see
#     exactly one key:
#       SSH_AUTH_SOCK="$HOME/Library/Group Containers/2BUA8C4S2C.com.1password/t/agent.sock" ssh-add -l

[[ssh-keys]]
item = "SSH - personal ed25519"
vault = "Private"
account = "my.1password.com"
