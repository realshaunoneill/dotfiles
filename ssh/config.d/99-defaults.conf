# ~/.ssh/config.d/99-defaults.conf — tracked in dotfiles (PUBLIC)
#
# The single `Host *` block, replacing the three separate ones the old monolithic
# config had accumulated (at lines 1, 6 and 182 — all three applied, in file
# order, which is why the 1Password IdentityAgent at the bottom silently won).
#
# MUST sort last. For single-valued keywords OpenSSH keeps the FIRST value it
# obtains, so everything here is a FALLBACK and anything in 10-/20-/30- is the
# exception that overrides it.
#
# NEVER add IdentityFile (or CertificateFile, or any *Forward) to this file. A
# configured IdentityFile REPLACES OpenSSH's built-in default list for every host
# that reaches this block, which would strip ~/.ssh/id_rsa from the work
# bastions — they have no explicit IdentityFile and survive on that default list.
# Verified: `ssh -o IdentityFile=X -G somehost` lists only X.

Host *
  # 300s x 2 => drop a dead session after about ten minutes.
  ServerAliveInterval 300
  ServerAliveCountMax 2

  # Connection sharing, carried over verbatim from the old config. Useful side
  # effect with 1Password: only the FIRST connection to a host triggers biometric
  # approval; later ones ride the existing master.
  #
  # KNOWN LATENT ISSUE: this also applies to scripted root@<IP> connections driven
  # by `expect` wrappers kept outside this repo. Under concurrency a shared master
  # means a session that never shows a password prompt — which is exactly what
  # their auth phase is waiting for, so it hangs.
  # The fix is one flag on the spawn line: -o ControlMaster=no
  ControlMaster auto
  ControlPath ~/.ssh/control-%r@%h:%p.socket

  # Trust on first use, but REFUSE a changed host key. This replaces the old
  # global `StrictHostKeyChecking no`, which silently accepted changed keys
  # everywhere including work production. known_hosts already holds every
  # LAN host already, so this has nothing to learn and adds no friction. If a host
  # is genuinely rebuilt, clear its entry: ssh-keygen -R <host-or-ip>
  #
  # Work recycles production hostnames constantly, so 30-work.conf deliberately
  # keeps `no` for those — and because it sorts first, it wins.
  StrictHostKeyChecking accept-new

  # Never hand an agent to a remote host unless a specific block asks for it.
  ForwardAgent no

  # The agent in use (1Password) is read-only and rejects additions, and both
  # on-disk keys are passphrase-less, so this would never do anything useful.
  AddKeysToAgent no
