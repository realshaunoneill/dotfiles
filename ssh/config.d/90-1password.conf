# ~/.ssh/config.d/90-1password.conf — tracked in dotfiles (PUBLIC), macOS ONLY.
#
# `zSetupSsh` installs this only when $machine = Mac. The path below is a macOS
# group-container path, and these dotfiles also run on Linux (see install.sh and
# the Linux branch in .zshrc) where it would be a dangling agent socket on every
# single host. The quotes are required — the path contains spaces.
#
# This sorts after every specific fragment on purpose. IdentityAgent is
# single-valued, so `IdentityAgent SSH_AUTH_SOCK` in 10-github.conf/30-work.conf
# and `IdentityAgent none` on the password-only homelab hosts are obtained first
# and win over this. The effect is: 1Password is the default agent, and work and
# password-only hosts opt out.
#
# The socket only exists while the 1Password app is running:
#   1Password > Settings > Developer > "Use the SSH agent"
#   1Password > Settings > General   > "Start at login"
# Check it with:
#   ls -l "$HOME/Library/Group Containers/2BUA8C4S2C.com.1password/t/agent.sock"
#
# Note that bare `ssh-add -l` queries $SSH_AUTH_SOCK (Apple's launchd agent), NOT
# this one. "The agent has no identities" from bare ssh-add is expected and is not
# a failure. To ask 1Password what it will actually offer:
#   SSH_AUTH_SOCK="$HOME/Library/Group Containers/2BUA8C4S2C.com.1password/t/agent.sock" ssh-add -l

Host *
  IdentityAgent "~/Library/Group Containers/2BUA8C4S2C.com.1password/t/agent.sock"
