# ~/.ssh/config.d/10-github.conf — tracked in dotfiles (PUBLIC)
#
# Two GitHub identities on one machine, selected by which alias you clone with.
# `clonep` in alias/functions.sh rewrites URLs to github.com-personal, and most
# repos under ~/Personal already use it. The blast radius of a mistake here is
# every personal repo.
#
# `IdentitiesOnly yes` plus an explicit IdentityFile is what stops ssh offering
# the wrong account's key — the classic cause of a "repository not found" on a
# personal repo you definitely have access to.

# Personal. The PRIVATE key lives only in 1Password and is never on disk.
# Pointing IdentityFile at a .pub is how you NAME an agent-held key: ssh reads
# the public half, finds the match in the agent, and has the agent sign.
# IdentityAgent is inherited from 90-1password.conf.
Host github.com-personal
  HostName github.com
  User git
  IdentitiesOnly yes
  IdentityFile ~/.ssh/id_ed25519_personal.pub
  IdentityFile ~/.ssh/id_rsa_personal        # TRANSITIONAL — drop once the 1P key is proven

# Work. ~/.ssh/id_rsa stays on disk: it is trusted by the work bastions and
# rotating it needs an internal process. IdentityAgent SSH_AUTH_SOCK is OpenSSH's
# literal special value meaning "use the environment variable", i.e. today's
# default agent — it beats the 1Password agent in 90- because this file sorts
# first, so a work `git fetch` never triggers a biometric prompt.
Host github.com
  HostName github.com
  User git
  IdentitiesOnly yes
  IdentityFile ~/.ssh/id_rsa
  IdentityAgent SSH_AUTH_SOCK

# Deliberately NOT set on either block: AddKeysToAgent and UseKeychain. Both
# on-disk keys are unencrypted (`ssh-keygen -y -P ""` succeeds on both), and
# UseKeychain only ever caches a passphrase — so it has been a no-op since 2020.
# AddKeysToAgent is worse than a no-op once 1Password is the agent: that agent is
# read-only and rejects key additions, so ssh tries and silently fails every time.
